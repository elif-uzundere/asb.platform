services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: asb
      POSTGRES_PASSWORD: asb
      POSTGRES_DB: asb_platform
    ports:
      - "5434:5432"
    volumes:
      - asb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asb -d asb_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  asb_postgres_data:
